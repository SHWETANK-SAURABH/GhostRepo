[project]
name = "ghostrepo-backend"
version = "0.1.0"
description = "Local-first repository investigation API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ollama: needs a running Ollama server and is skipped when none is reachable",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S101", "S105", "S106", "S108", "S603", "S607"]
